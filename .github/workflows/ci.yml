name: ci
on:
  push:
    branches: ["main", "validation/**", "feat/**", "fix/**", "mission/**"]
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # numeric-integrity check diffs against pre-redaction history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install pytest numpy soundfile
      - name: Public evidence guard (no raw benchmark text)
        run: python3 scripts/public_evidence_guard.py
      - name: Evidence lyrics detector (key-scan tier; ground-truth tier auto-off without dataset)
        run: python3 scripts/evidence_lyrics_detector.py
      - name: Evidence lyrics detector unit tests (synthetic fixtures only)
        run: python -m pytest -q tests/test_evidence_lyrics_detector.py
      - name: Exercise tier-2 matcher end-to-end (synthetic data only)
        run: python -m pytest -q tests/test_evidence_detector_integration.py
      - name: Numeric receipt integrity (redaction vs pre-redaction originals)
        run: python3 scripts/verify_numeric_receipt_integrity.py
      - name: Public evidence guard unit tests
        run: python3 -m pytest -q tests/test_public_evidence.py
      - name: Compile-check all python (scripts + supervisor)
        run: python -m compileall -q scripts supervisor
      - name: Shell syntax check (all scripts)
        run: bash -n scripts/*.sh
      - name: ShellCheck (errors only; advisory findings non-blocking)
        run: |
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          if command -v shellcheck >/dev/null; then
            shellcheck --severity=error scripts/*.sh || { echo "::error::shellcheck severity=error findings"; exit 1; }
          else
            echo "::warning::shellcheck unavailable; syntax check only"
          fi
      - name: Workspace resolution contract
        run: python -m pytest tests/test_workspace_resolution.py -q
      - name: Protocol-lock and pin consistency
        run: python -m pytest tests/test_protocol_lock.py -q
      - name: Documentation command contract
        run: python -m pytest tests/test_docs_contract.py -q
      - name: Complete CPU test suite (manifest-dependent tests SKIP honestly)
        run: |
          python -m pytest tests -q \
            --ignore=tests/test_yue2_rocm_fallbacks.py \
            --ignore=tests/test_server_yue2_rocm.py \
            --ignore=tests/test_first_audio.py \
            -ra --strict-markers
      - name: Test summary (PASS/FAIL/SKIP visibility)
        if: always()
        run: echo "CPU suite complete. GPU acceptance (fallbacks, live server, first audio) runs on hardware; see reports/publication/."

  # Real CPU numerics for the Q3O MoE placement blocks: torch IS installed
  # (pinned CPU wheel) so the routing/rounding tests RUN here instead of
  # skipping. GPU-block cases SKIP honestly on this runner and are never
  # counted as GPU validation; accelerator evidence stays on the W7900 host.
  q3o-moe-cpu-numerics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU PyTorch
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install test deps
        run: python -m pip install pytest
      - name: Environment disclosure (CPU-only, verified)
        run: |
          python -c "import torch, json; assert not torch.cuda.is_available(); print(json.dumps({'torch': torch.__version__, 'gpu': False}))"
      - name: Q3O MoE CPU numerics (stable top-k, boundary tie, expert identity, routing weights, weight normalisation, CPU-resident block, BF16 rounding points, HF reference comparison, determinism)
        run: python -m pytest tests/test_rc5_q3o_moe.py -v -ra --strict-markers
      - name: Mutation controls (CPU-applicable; GPU-block mutations survive honestly on a CPU runner)
        run: |
          mkdir -p reports-ci
          python3 scripts/mutation_controls_q3o_moe.py --python "$(command -v python)" \
            --label ci-cpu-torch-2.12.0 --out reports-ci/mutation_q3o_moe_cpu.json
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3o-moe-cpu-mutation-report
          path: reports-ci/mutation_q3o_moe_cpu.json
  # GPU acceptance is deliberately NOT claimed here: gfx1100 evidence is
  # produced on the physical W7900 and recorded under evidence/publication/.
