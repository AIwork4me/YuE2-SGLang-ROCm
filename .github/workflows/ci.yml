name: cpu-tests
on:
  push:
    branches: ["main", "validation/**"]
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install pytest
      - name: Syntax-check all python in scripts/
        run: python -m compileall -q scripts
      - name: WSB harness tests (skip without pinned manifest)
        run: python -m pytest tests/test_wsb_full_mode.py tests/test_wsb_resume.py -q
        env:
          YUE2_WORKSPACE: ${{ github.workspace }}
      - name: Shell syntax check
        run: bash -n scripts/*.sh
