deviations_from_official:  # all disclosed; none touch model math, scoring, selection or aggregation
  - id: DEV-1
    what: "Arm A uses --backend torch-eager instead of --backend torch (graph capture)"
    why: "yue2 0.1.3 GraphAR selects aten varlen FlashAttention by schema-presence; the ROCm
          mha_varlen_fwd kernel rejects seqused_k (RuntimeError: [ROCm] mha_varlen_fwd:
          seqused_k must be nullopt). torch-eager is an official CLI backend that runs the
          public-SDPA path documented for AMD ROCm in YuE docs/hardware.md."
    risk: "kernel-selection numerics may differ from the CUDA graph path (same class of
           difference as any cross-vendor comparison); no bar-lowering involved"
  - id: DEV-2
    what: "PER ASR engine = qwen_asr transformers backend (patch 0007), not vLLM 0.14.0"
    why: "vLLM 0.14.0 is CUDA-only; no ROCm build exists for the frozen pin"
    risk: "measured single-candidate drift 0.6pp / batch-composition sensitivity (Run B
           evidence); cross-backend equivalence NOT claimed; every PER labeled
           'ASR backend: qwen_asr/transformers on ROCm'"
  - id: DEV-3
    what: "Evaluator metrics venv torch-family substituted under env gate (patch 0006)"
    why: "frozen lock pins CUDA-only torch 2.9.1/2.7.0; AMD publishes no ROCm builds of those"
    risk: "all 224 other lock entries exact; receipts record the substitution"
  - id: DEV-4
    what: "Q3O not run"
    why: "official protocol requires an 80GB GPU; W7900 has 48GB"
    risk: "reported as NOT TESTED; never included in 'all metrics' claims"
